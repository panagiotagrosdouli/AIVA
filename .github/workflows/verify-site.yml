name: Verify AIVA site
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Europe job normalizer
        run: python -m unittest discover -s tests
      - name: Check HTML scripts and feed structure
        run: python scripts/verify_site.py
