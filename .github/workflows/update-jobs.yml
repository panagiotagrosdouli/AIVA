name: Update real job listings
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_employers.py'
      - 'scripts/sync_jobs.py'
      - 'data/employer_boards.json'
      - '.github/workflows/update-jobs.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public job feed
        run: python scripts/sync_jobs.py
      - name: Fetch official employer postings
        continue-on-error: true
        run: python scripts/sync_employers.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if test -f data/employer_jobs.json; then git add data/employer_jobs.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update sourced global job listings"
            git push
          fi
